[project]
name = "chaoxing-crawler"
version = "1.0.0"
description = "学习通题目爬虫"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "openpyxl>=3.0.0",
    "pillow>=9.0.0",
    "loguru>=0.7.0",
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
