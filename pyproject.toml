[project]
name = "rag-chatbot"
version = "2.0.0"
description = "RAG 知识库聊天机器人（FastAPI + Gradio + DeepSeek API + PostgreSQL/pgvector）"
requires-python = ">=3.8"
dependencies = [
    # ---- 前端 ----
    "gradio>=6.0",
    # ---- 后端 ----
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
    # ---- 数据库 ----
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # ---- HTTP ----
    "httpx>=0.27",
    "requests>=2.28",
    # ---- 文档解析 ----
    "pypdf>=4.0",
    # ---- LLM（DeepSeek，经 LlamaIndex）----
    "llama-index-core>=0.11",
    "llama-index-llms-deepseek>=0.3",
    # ---- 日志 ----
    "loguru>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
