# 学习通题目爬虫配置

# 账号配置
ACCOUNT:
  username: ""  # 填写您的学习通账号
  password: ""  # 填写您的学习通密码

# 爬虫配置
CRAWLER:
  # 请求间隔（秒），建议设置较大以避免被封
  request_delay: 2
  # 最大重试次数
  max_retries: 3
  # 请求超时时间（秒）
  timeout: 30
  # 是否启用代理
  use_proxy: false

# 数据存储配置
STORAGE:
  # 输出格式: json, excel, csv
  output_format: json
  # 输出文件路径
  output_file: "questions_data"
  # 是否保存图片
  save_images: false

# 日志配置
LOGGING:
  level: INFO
  file: "crawler.log"
  max_bytes: 10485760  # 10MB
  backup_count: 3
